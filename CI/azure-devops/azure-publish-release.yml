trigger:
  branches:
    include:
      - 'pavel/test_release'
  tags:
    include:
      - 'refs/tags/*'

pr: none

variables:
- name: CmakeGenOptions
  value: -DBUILD_JSON_ARCHIVE=ON -DBUILD_RAPIDJSON_ARCHIVE=ON -DBUILD_PUGIXML_ARCHIVE=ON -DBUILD_RAPIDYAML_ARCHIVE=ON -DBUILD_CSV_ARCHIVE=ON -DBUILD_MSGPACK_ARCHIVE=ON
  readonly: true

stages:
  - stage: BuildPackages
    displayName: 'Build packages'
    jobs:
      - template: templates/windows-msvc-publish-release-template.yml
        parameters:
          name: 'Windows_VS2022_x86_static'
          image: 'windows-2022'
          platform: 'x86'
          vcpkgTriplet: "x86-windows"
          cmakeGenArgs: '$(CmakeGenOptions)'
          packageSuffix: '_x86_windows_msvc17_static'

      - template: templates/windows-msvc-publish-release-template.yml
        parameters:
          name: 'Windows_VS2022_x64_static'
          image: 'windows-2022'
          platform: 'x64'
          vcpkgTriplet: "x64-windows"
          cmakeGenArgs: '$(CmakeGenOptions)'
          packageSuffix: '_x64_windows_msvc17_static'

      - template: templates/windows-msvc-publish-release-template.yml
        parameters:
          name: 'Windows_VS2022_x64_dynamic'
          image: 'windows-2022'
          platform: 'x64'
          vcpkgTriplet: "x64-windows"
          cmakeGenArgs: '$(CmakeGenOptions) -DBUILD_SHARED_LIBS=ON'
          packageSuffix: '_x64_windows_msvc17_dynamic'

      - template: templates/unix-publish-release-template.yml
        parameters:
          name: 'Linux_x64_GCC8_glibc228_static'
          image: 'ubuntu-latest'
          container: 'almalinux:8'
          containerOptions: '--user root'
          installToolsCmd: 'bash $(Build.SourcesDirectory)/CI/azure-devops/scripts/install-almalinux8-build-tools.sh'
          vcpkgTriplet: "x64-linux"
          cmakeGenArgs: '$(CmakeGenOptions)'
          packageSuffix: '_x64_linux_glibc228_gcc8_static'

      - template: templates/unix-publish-release-template.yml
        parameters:
          name: 'MacOS_x64_static'
          image: 'macOS-15'
          installToolsCmd: 'brew install ninja'
          vcpkgTriplet: "x64-osx"
          cmakeGenArgs: '$(CmakeGenOptions) -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -DVCPKG_OVERLAY_TRIPLETS=$(Build.SourcesDirectory)/cmake/vcpkg/triplets'
          packageSuffix: '_x64_macos1015_clang_static'

      - template: templates/unix-publish-release-template.yml
        parameters:
          name: 'Linux_ARM64_GCC13_static'
          image: 'ubuntu-22.04'
          installToolsCmd: 'sudo apt-get update && sudo apt-get install -y ninja-build qemu-user'
          compilerUrl: "https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/arm-gnu-toolchain-13.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz"
          vcpkgTriplet: "bitserializer-arm64-linux"
          cmakeGenArgs: '$(CmakeGenOptions) -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$(Build.SourcesDirectory)/cmake/toolchains/arm64-linux-toolchain.cmake'
          packageSuffix: '_arm64_linux_gcc13_static'

      - template: templates/unix-publish-release-template.yml
        parameters:
          name: 'Linux_ARM64BE_GCC13_static'
          image: 'ubuntu-22.04'
          installToolsCmd: 'sudo apt-get update && sudo apt-get install -y ninja-build qemu-user'
          compilerUrl: "https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/arm-gnu-toolchain-13.3.rel1-x86_64-aarch64_be-none-linux-gnu.tar.xz"
          vcpkgTriplet: "bitserializer-arm64be-linux"
          cmakeGenArgs: '$(CmakeGenOptions) -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$(Build.SourcesDirectory)/cmake/toolchains/arm64be-linux-toolchain.cmake'
          packageSuffix: '_arm64be_linux_gcc13_static'

  - stage: PublishRelease
    displayName: 'Publish release'
    dependsOn: BuildPackages
    condition: succeeded()
    jobs:
    - job: PublishRelease
      pool:
        vmImage: 'ubuntu-latest'
      steps:
      - task: DownloadPipelineArtifact@2
        displayName: 'Download packages'
        inputs:
          buildType: 'current'
          targetPath: '$(Pipeline.Workspace)/packages'

      - script: |
          bash "$(Build.SourcesDirectory)/CI/azure-devops/scripts/validate-release-assets.sh" "$(Pipeline.Workspace)/packages" "$(Build.SourceBranchName)"
        displayName: 'Validate release packages'

      - task: GitHubRelease@1
        displayName: 'Create or update GitHub release'
        inputs:
          gitHubConnection: 'PavelKisliak'
          repositoryName: '$(Build.Repository.Name)'
          action: 'edit'
          isDraft: true
          target: '$(Build.SourceVersion)'
          tag: $(Build.SourceBranchName)
          tagSource: 'userSpecifiedTag'
          title: '$(Build.SourceBranchName)'
          addChangeLog: false
          assets: |
            $(Pipeline.Workspace)/packages/**/*.zip
            $(Pipeline.Workspace)/packages/**/*.tar.gz
          assetUploadMode: 'delete'
