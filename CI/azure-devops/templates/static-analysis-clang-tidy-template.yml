parameters:
# [Required] Job name
  name: ''
# [Required] Build agent name
  image: ''
# [Required] VCPKG triplet
  vcpkgTriplet: ''
# [Optional] CMake additional arguments for CMake generate mode
  cmakeGenArgs: ''
# [Optional] Full analysis or just changes from last commit
  fullAnalysis: true
# [Optional] Build directory
  buildDirectory: 'build'

jobs:
- job: ${{ parameters.name }}
  timeoutInMinutes: 120
  pool:
    vmImage: ${{ parameters.image }}
  variables:
    vcpkgDir: '$(Pipeline.Workspace)/vcpkg'
    # The last successfully analyzed revision. Kept in a small dedicated cache so the early skip
    # decision doesn't require restoring the large build cache.
    analysisStateDir: '$(Pipeline.Workspace)/analysis-state'

  steps:
  - checkout: self
    # The changed-files list is computed against the last analyzed revision (stored in the
    # analysis-state cache) and against the cached build revision, so the full history is
    # required (the repository is small).
    fetchDepth: 0

  - task: Cache@2
    inputs:
      key: |
        analysis-state | v1 | $(Build.SourceVersion)
      restoreKeys: |
        analysis-state | v1
      path: $(analysisStateDir)
      cacheHitVar: ANALYSIS_STATE_RESTORED
    displayName: 'Restore analysis state'
    condition: succeeded()

  - script: |
      echo ------------------------------------------------------------------------------
      echo -- Detecting changes since the last analysis
      echo ------------------------------------------------------------------------------
      # Skip the whole job when nothing C/C++ or build-related changed since the last successful
      # analysis. Comparing against the last analyzed revision (not just the last commit) is
      # required: a single push may contain several commits, and the latest one may not touch
      # the code. The build is needed for the dependency graph and the build cache used for
      # incremental analysis.
      state_dir="$(analysisStateDir)"
      base_version=""
      if [ -f "$state_dir/last_built_sha" ]; then
        candidate=$(cat "$state_dir/last_built_sha")
        if [ -n "$candidate" ] && git rev-parse --verify --quiet "$candidate^{commit}" > /dev/null; then
          base_version="$candidate"
        else
          echo "The recorded revision '$candidate' is not available in the repository."
        fi
      fi

      if [ -z "$base_version" ]; then
        # No reliable base (first run of the branch, expired cache or force-push): run the analysis.
        echo "##vso[task.setvariable variable=hasRelevantChanges]true"
        echo "No recorded last analyzed revision, static analysis will run."
      elif changed_files=$(git diff --name-only "$base_version" HEAD 2>/dev/null); then
        echo "Changes since the last analysis ($base_version):"
        echo "$changed_files"
        relevant_files=$(echo "$changed_files" | grep -E '\.(h|hpp|cpp|cc)$|(^|/)(vcpkg\.json|CMakeLists\.txt|CMakePresets\.json|CMakeSettings\.json)$|^cmake/.*\.h\.in$|\.cmake$' || true)
        if [ -n "$relevant_files" ]; then
          echo "##vso[task.setvariable variable=hasRelevantChanges]true"
          echo "Analysis-relevant files changed:"
          echo "$relevant_files"
        else
          echo "##vso[task.setvariable variable=hasRelevantChanges]false"
          echo "No C/C++ or build configuration changes, static analysis will be skipped."
        fi
      else
        echo "##vso[task.setvariable variable=hasRelevantChanges]true"
        echo "Failed to determine changed files, static analysis will run."
      fi
    displayName: 'Detect changes since last analysis'

  - script: |
      echo --- Install build tools ---
      sudo apt-get install ninja-build
    displayName: 'Install build tools'
    condition: and(succeeded(), or(eq('${{ parameters.fullAnalysis }}', true), eq(variables.hasRelevantChanges, 'true')))

  - script: |
      echo ------------------------------------------------------------------------------
      echo -- Tools version info
      echo ------------------------------------------------------------------------------
      cmake --version
      ninja --version
      clang-tidy --version
    displayName: 'Tools version info'
    condition: and(succeeded(), or(eq('${{ parameters.fullAnalysis }}', true), eq(variables.hasRelevantChanges, 'true')))

  - script: |
      echo ------------------------------------------------------------------------------
      echo -- Clone latest VCPKG
      echo ------------------------------------------------------------------------------
      git clone -v "https://$(GITHUB_TOKEN)@github.com/Microsoft/vcpkg.git" "${{ variables.vcpkgDir }}"
      VCPKG_COMMIT=$(python3 "$(Build.SourcesDirectory)/CI/azure-devops/scripts/get_vcpkg_baseline.py")
      if [ -z "$VCPKG_COMMIT" ]; then
        echo "Failed to read VCPKG baseline from vcpkg.json"
        exit 1
      fi
      echo "##vso[task.setvariable variable=vcpkgCommit]$VCPKG_COMMIT"
      git -C "${{ variables.vcpkgDir }}" checkout "$VCPKG_COMMIT"
      echo
      echo ------------------------------------------------------------------------------
      echo -- Bootstrap VCPKG
      echo ------------------------------------------------------------------------------
      ${{ variables.vcpkgDir }}/bootstrap-vcpkg.sh
    displayName: 'Install VCPKG'
    condition: and(succeeded(), or(eq('${{ parameters.fullAnalysis }}', true), eq(variables.hasRelevantChanges, 'true')))
    env:
      GITHUB_TOKEN: $(GITHUB_TOKEN)

  # Bump the `v3` component whenever the incremental analysis inputs or the affected-source
  # detection changes, so a cache produced by the previous logic is not reused.
  - task: Cache@2
    inputs:
      key: |
        ninja-build | v3 | $(vcpkgCommit) | $(Build.SourcesDirectory)/vcpkg.json | $(Build.SourceVersion)
      restoreKeys: |
        ninja-build | v3 | $(vcpkgCommit) | $(Build.SourcesDirectory)/vcpkg.json
      path: ${{ parameters.buildDirectory }}
      cacheHitVar: BUILD_CACHE_RESTORED
    displayName: Restore build cache
    condition: and(succeeded(), eq('${{ parameters.fullAnalysis }}', false), eq(variables.hasRelevantChanges, 'true'))

  - task: Cache@2
    inputs:
      key: |
        vcpkg | v9 | $(vcpkgCommit) | ${{ parameters.name }} | $(Build.SourcesDirectory)/vcpkg.json
      restoreKeys: |
        vcpkg | v9 | $(vcpkgCommit) | ${{ parameters.name }}
      path: ${{ parameters.buildDirectory }}/vcpkg_installed/
      cacheHitVar: VCPKG_CACHE_RESTORED
    displayName: Configure cache of VCPKG packages
    condition: and(succeeded(), or(eq('${{ parameters.fullAnalysis }}', true), eq(variables.hasRelevantChanges, 'true')))

  - task: CMake@1
    inputs:
      workingDirectory: ${{ parameters.buildDirectory }}
      # Debug keeps compilation fast; -g0 drops debug info because this build is only needed for the
      # dependency graph and the incremental build cache (it halves the cache size).
      cmakeArgs: '${{ parameters.cmakeGenArgs }} -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS_DEBUG=-g0 -DCMAKE_C_FLAGS_DEBUG=-g0 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_TOOLCHAIN_FILE=$(Build.SourcesDirectory)/../vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ parameters.vcpkgTriplet }} .. -G Ninja'
    displayName: 'CMake - generate'
    condition: and(succeeded(), or(eq('${{ parameters.fullAnalysis }}', true), eq(variables.hasRelevantChanges, 'true')))

  - script: |
      set -e
      build_dir="${{ parameters.buildDirectory }}"
      changed_file="$build_dir/changed_since_build.txt"

      diff_failed=false
      if [ -f "$build_dir/.last_source_version" ]; then
        base_version=$(cat "$build_dir/.last_source_version")
        if git rev-parse --verify --quiet "$base_version^{commit}" > /dev/null; then
          echo "Changes since the last build ($base_version):"
          git diff --name-only "$base_version" HEAD > "$changed_file" || diff_failed=true
        else
          # The cached revision is unknown (e.g. a force-push), the incremental build is not reliable.
          echo "The cached build revision $base_version is not available."
          diff_failed=true
        fi
      elif [ "$BUILD_CACHE_RESTORED" = "false" ]; then
        # The build cache is empty, so the incremental build cannot be used, but the analysis-state
        # marker still tells what has changed since the last successful analysis.
        state_base=""
        if [ -f "$(analysisStateDir)/last_built_sha" ]; then
          candidate=$(cat "$(analysisStateDir)/last_built_sha")
          if [ -n "$candidate" ] && git rev-parse --verify --quiet "$candidate^{commit}" > /dev/null; then
            state_base="$candidate"
          fi
        fi
        if [ -n "$state_base" ]; then
          echo "The build cache is empty, using the last analyzed revision ($state_base):"
          git diff --name-only "$state_base" HEAD > "$changed_file" || diff_failed=true
        else
          echo "The build cache is empty, using the previous commit:"
          git diff HEAD HEAD~ --name-only > "$changed_file" 2>/dev/null || diff_failed=true
        fi
      else
        # A restored build cache must have the revision marker; otherwise its contents are unusable.
        echo "The restored build cache has no source revision marker."
        diff_failed=true
      fi
      if [ "$diff_failed" = "true" ]; then
        echo "__all__" > "$changed_file"
      fi
      cat "$changed_file"

      # A full analysis is needed only when the incremental build cannot capture a global build
      # change. With a restored build cache Ninja recompiles every translation unit whose compiler
      # command changed, and the rebuilt-object list covers them, so cosmetic edits (for example a
      # `configure_file`-only CMake change) are not forced into a full run. When the build cache is
      # empty, global build changes cannot be mapped to translation units from the changed files,
      # so they still force a full analysis. Nested `CMakeLists.txt` files only affect their target
      # and are handled by the incremental rebuild.
      force_full=false
      if [ "$diff_failed" = "true" ] || { [ "$BUILD_CACHE_RESTORED" = "false" ] && grep -Eq '^(vcpkg\.json|CMakePresets\.json|CMakeSettings\.json|CMakeLists\.txt)$|\.cmake$|^cmake/.*\.h\.in$' "$changed_file"; }; then
        force_full=true
      fi
      echo "##vso[task.setvariable variable=forceFullAnalysis]$force_full"

      if [ "$force_full" = "true" ]; then
        echo "The build configuration changed, the full analysis will run."
      elif [ "$BUILD_CACHE_RESTORED" != "false" ]; then
        # Restored build artifacts keep their timestamps (the Ninja deps log records them too),
        # so make unchanged sources older than the artifacts to prevent a full rebuild.
        # Files changed since the cached build become newer and are recompiled by Ninja.
        echo "Normalizing file timestamps for the incremental build..."
        git ls-files -z | xargs -0 -r touch -h -d '2000-01-01 00:00:00'
        if [ -d "$build_dir/vcpkg_installed" ]; then
          find "$build_dir/vcpkg_installed" -type f -exec touch -d '2000-01-01 00:00:00' {} +
        fi
        while IFS= read -r changed_path; do
          if [ -n "$changed_path" ] && [ -e "$changed_path" ]; then
            touch -h "$changed_path"
          fi
        done < "$changed_file"
      fi
    displayName: 'Prepare incremental build'
    condition: and(succeeded(), eq('${{ parameters.fullAnalysis }}', false), eq(variables.hasRelevantChanges, 'true'))

  - script: |
      set -e
      build_dir="${{ parameters.buildDirectory }}"
      touch "$build_dir/.build_start_marker"
      ninja -C "$build_dir"
      ninja -C "$build_dir" -t deps > "$build_dir/deps.txt"
      git rev-parse HEAD > "$build_dir/.last_source_version"
      # Advance the analysis-state marker (used by the skip decision of the next run) only after
      # a successful incremental build, so a failed or skipped job never loses unreviewed changes.
      # A forced full analysis owns the marker and advances it only after the analysis succeeds.
      if [ "$(forceFullAnalysis)" != "true" ]; then
        mkdir -p "$(analysisStateDir)"
        git rev-parse HEAD > "$(analysisStateDir)/last_built_sha"
      fi
    displayName: 'Build'
    condition: and(succeeded(), eq('${{ parameters.fullAnalysis }}', false), eq(variables.hasRelevantChanges, 'true'))

  - script: |
      set -e
      build_dir="${{ parameters.buildDirectory }}"
      echo ------------------------------------------------------------------------------
      echo -- Identifying affected source files
      echo ------------------------------------------------------------------------------
      if [ "$BUILD_CACHE_RESTORED" != "false" ]; then
        # Analyze exactly the translation units rebuilt by the incremental build: this covers all
        # units that include a changed header (not just one per header) as well as units recompiled
        # due to changes in their dependencies or compiler settings.
        find "$build_dir" -type f \( -name '*.o' -o -name '*.obj' \) -newer "$build_dir/.build_start_marker" > "$build_dir/rebuilt_objects.txt"
        python tools/static_analysis/find_rebuilt_sources.py "$build_dir" "$build_dir/rebuilt_objects.txt" "$build_dir/affected_sources.txt"
      else
        python tools/static_analysis/find_affected_files.py "$build_dir/deps.txt" "$build_dir/changed_since_build.txt" "$build_dir/affected_sources.txt"
      fi
      affected_sources=$(cat "$build_dir/affected_sources.txt")
      if [ -n "$affected_sources" ]; then
          echo
          echo $affected_sources
          echo
          echo ------------------------------------------------------------------------------
          echo -- Сlang-tidy analysis
          echo ------------------------------------------------------------------------------
          python ./tools/static_analysis/clang-tidy/run-clang-tidy.py -config-file=".clang-tidy" -p "$build_dir" $affected_sources
      else
          echo "No affected source files found. Skipping clang-tidy analysis."
      fi
    displayName: 'Static analysis [latest changes]'
    condition: and(succeeded(), eq('${{ parameters.fullAnalysis }}', false), eq(variables.hasRelevantChanges, 'true'), eq(variables.forceFullAnalysis, 'false'))

  - script: |
      python ./tools/static_analysis/clang-tidy/run-clang-tidy.py -config-file=".clang-tidy" -p ${{ parameters.buildDirectory }}
      EXIT_CODE=$?
      if [ $EXIT_CODE -eq 0 ]; then
          # Advance the analysis-state marker only after a clean full analysis, so a failed run
          # never hides unreviewed changes from the skip decision of the next run.
          mkdir -p "$(analysisStateDir)"
          git rev-parse HEAD > "$(analysisStateDir)/last_built_sha"
      else
          echo "##vso[task.logissue type=warning]Warnings or errors were found during clang-tidy analysis."
          echo "##vso[task.complete result=SucceededWithIssues;]Pipeline marked as partially succeeded due to clang-tidy warnings."
      fi
    continueOnError: true
    displayName: 'Static analysis [full]'
    condition: and(succeeded(), or(eq('${{ parameters.fullAnalysis }}', true), eq(variables.forceFullAnalysis, 'true')))
    timeoutInMinutes: 90
