parameters:
# [Required] Job name
  name: ''
# [Required] Build agent name
  image: ''
# [Optional] Container image (for building against an older glibc)
  container: ''
# [Optional] Container startup options
  containerOptions: '--user root'
# [Required] VCPKG triplet
  vcpkgTriplet: ''
# [Optional] Install additional tools command line
  installToolsCmd: ''
# [Optional] URL to download the compiler
  compilerUrl: ''
# [Optional] CMake additional arguments for CMake generate mode
  cmakeGenArgs: ''
# [Optional] Package suffix
  packageSuffix: ''

jobs:
- job: ${{ parameters.name }}
  pool:
    vmImage: ${{ parameters.image }}
  ${{ if ne(parameters.container, '') }}:
    container:
      image: ${{ parameters.container }}
      options: ${{ parameters.containerOptions }}
  variables:
    vcpkgDir: '$(Pipeline.Workspace)/vcpkg'
    installDir: '$(Build.ArtifactStagingDirectory)/install/bitserializer-$(Build.SourceBranchName)'
    archiveFilePath: '$(Build.ArtifactStagingDirectory)/install/bitserializer_$(Build.SourceBranchName)${{ parameters.packageSuffix }}.tar.gz'
    acceptanceTestsDir: '$(Build.SourcesDirectory)/tests/acceptance_tests'

  steps:
  - script: |
      set -e
      container_id=$(docker ps --filter "ancestor=${{ parameters.container }}" --format "{{.ID}}" | head -n 1)
      if [ -z "$container_id" ]; then
        echo "Container for image '${{ parameters.container }}' was not found." >&2
        exit 1
      fi
      docker exec "$container_id" dnf install -y sudo
    displayName: 'Install sudo in container'
    condition: ne('${{ parameters.container }}', '')
    target: host

  - script: |
      echo ------------------------------------------------------------------------------
      echo -- Install build tools
      echo ------------------------------------------------------------------------------
      ${{ parameters.installToolsCmd }}
    displayName: 'Install build tools'
    condition: ne('${{ parameters.installToolsCmd }}', '')

  - script: |
      echo ------------------------------------------------------------------------------
      echo -- Download compiler
      echo ------------------------------------------------------------------------------
      wget -nv ${{ parameters.compilerUrl }} -O compiler.tar.xz
      echo
      echo ------------------------------------------------------------------------------
      echo -- Extract compiler
      echo ------------------------------------------------------------------------------
      sudo tar -xf compiler.tar.xz -C /usr/
    displayName: 'Install compiler'
    condition: ne('${{ parameters.compilerUrl }}', '')

  - script: |
      set -e
      echo ------------------------------------------------------------------------------
      echo -- Clone latest VCPKG
      echo ------------------------------------------------------------------------------
      git clone -v "https://github.com/microsoft/vcpkg.git" "${{ variables.vcpkgDir }}"
      VCPKG_COMMIT=$(python3 "$(Build.SourcesDirectory)/CI/azure-devops/scripts/get_vcpkg_baseline.py")
      if [ -z "$VCPKG_COMMIT" ]; then
        echo "Failed to read VCPKG baseline from vcpkg.json"
        exit 1
      fi
      git -C "${{ variables.vcpkgDir }}" checkout "$VCPKG_COMMIT"
      echo
      echo ------------------------------------------------------------------------------
      echo -- Bootstrap VCPKG
      echo ------------------------------------------------------------------------------
      ${{ variables.vcpkgDir }}/bootstrap-vcpkg.sh
    displayName: 'Install VCPKG'

  - script: |
      set -e
      echo ------------------------------------------------------------------------------
      echo -- CMake: generate [Debug]
      echo ------------------------------------------------------------------------------
      cmake -GNinja -B build-debug -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE=${{ variables.vcpkgDir }}/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ parameters.vcpkgTriplet }} -DCMAKE_INSTALL_PREFIX:PATH=${{ variables.installDir }} ${{ parameters.cmakeGenArgs }}
      echo
      echo ------------------------------------------------------------------------------
      echo -- CMake: generate [Release]
      echo ------------------------------------------------------------------------------
      cmake -GNinja -B build-release -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=${{ variables.vcpkgDir }}/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ parameters.vcpkgTriplet }} -DCMAKE_INSTALL_PREFIX:PATH=${{ variables.installDir }} ${{ parameters.cmakeGenArgs }}
    displayName: 'CMake - generate'

  - script: |
      set -e
      echo ------------------------------------------------------------------------------
      echo -- Build and install library [Debug]
      echo ------------------------------------------------------------------------------
      ninja install -C build-debug
      echo
      echo ------------------------------------------------------------------------------
      echo -- Build and install library [Release]
      echo ------------------------------------------------------------------------------
      ninja install -C build-release
    displayName: 'Build and install'

  - script: |
      set -e
      cmake -S "$(Build.SourcesDirectory)/tests/acceptance_tests/package_config_tests" -B "$(Build.ArtifactStagingDirectory)/package-check" -DCMAKE_PREFIX_PATH="${{ variables.installDir }}"
    displayName: 'Verify default package components'

  - script: |
      set -e
      echo ------------------------------------------------------------------------------
      echo -- CMake: generate acceptance tests [Debug]
      echo ------------------------------------------------------------------------------
      cd ${{ variables.acceptanceTestsDir }}
      cmake -GNinja -B build-debug -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE=${{ variables.vcpkgDir }}/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ parameters.vcpkgTriplet }} -DVCPKG_MANIFEST_DIR=$(Build.SourcesDirectory) -DCMAKE_PREFIX_PATH=${{ variables.installDir }} -DCMAKE_POSITION_INDEPENDENT_CODE=ON ${{ parameters.cmakeGenArgs }}
      echo
      echo ------------------------------------------------------------------------------
      echo -- CMake: build acceptance tests [Debug]
      echo ------------------------------------------------------------------------------
      ninja -C build-debug
    displayName: 'Build acceptance tests [Debug]'

  - script: |
      set -e
      ctest --test-dir ${{ variables.acceptanceTestsDir }}/build-debug --output-on-failure -j2
    displayName: 'Run acceptance tests [Debug]'

  - script: |
      set -e
      echo ------------------------------------------------------------------------------
      echo -- CMake: generate acceptance tests [Release]
      echo ------------------------------------------------------------------------------
      cd ${{ variables.acceptanceTestsDir }}
      cmake -GNinja -B build-release -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=${{ variables.vcpkgDir }}/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ parameters.vcpkgTriplet }} -DVCPKG_MANIFEST_DIR=$(Build.SourcesDirectory) -DCMAKE_PREFIX_PATH=${{ variables.installDir }} -DCMAKE_POSITION_INDEPENDENT_CODE=ON ${{ parameters.cmakeGenArgs }}
      echo
      echo ------------------------------------------------------------------------------
      echo -- CMake: build acceptance tests [Release]
      echo ------------------------------------------------------------------------------
      ninja -C build-release
    displayName: 'Build acceptance tests [Release]'

  - script: |
      set -e
      ctest --test-dir ${{ variables.acceptanceTestsDir }}/build-release --output-on-failure -j2
    displayName: 'Run acceptance tests [Release]'

  - task: ArchiveFiles@2
    ${{ if ne(parameters.container, '') }}:
      target: host
    displayName: Zip package
    inputs:
      rootFolderOrFile: '${{ variables.installDir }}'
      archiveType: 'tar'
      tarCompression: 'gz'
      archiveFile: '${{ variables.archiveFilePath }}'
      replaceExistingArchive: true

  - task: PublishPipelineArtifact@1
    ${{ if ne(parameters.container, '') }}:
      target: host
    displayName: 'Publish package artifact'
    inputs:
      targetPath: '${{ variables.archiveFilePath }}'
      artifact: '${{ parameters.name }}'
