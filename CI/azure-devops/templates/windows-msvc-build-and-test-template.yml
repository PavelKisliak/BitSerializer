parameters:
# [Required] Job name
  name: ''
# [Required] Build agent name
  image: ''
# [Optional] Platform [x64, x86]
  platform: 'x64'
# [Required] VCPKG triplet
  vcpkgTriplet: 'x64-windows-release'
# [Optional] CMake additional arguments for CMake generate mode
  cmakeGenArgs: ''
# [Optional] Build configuration (Debug, Release)
  buildConfiguration: 'Release'
# [Optional] Enable run tests
  enableRunTests: true
# [Optional] When to publish test results: always | onFailure | never
  publishTestResults: 'onFailure'

jobs:
- job: ${{ parameters.name }}
  pool:
    vmImage: ${{ parameters.image }}
  variables:
    vcpkgDir: '$(Pipeline.Workspace)/vcpkg'
    buildDirectory: 'build'

  steps:
  - script: |
      echo ------------------------------------------------------------------------------
      echo -- Clone latest VCPKG
      echo ------------------------------------------------------------------------------
      git clone -v "https://$(GITHUB_TOKEN)@github.com/microsoft/vcpkg.git" "${{ variables.vcpkgDir }}"
      for /f "usebackq delims=" %%i in (`python "$(Build.SourcesDirectory)\CI\azure-devops\scripts\get_vcpkg_baseline.py"`) do set "VCPKG_COMMIT=%%i"
      if not defined VCPKG_COMMIT (
        echo Failed to read VCPKG baseline from vcpkg.json
        exit 1
      )
      echo ##vso[task.setvariable variable=vcpkgCommit]%VCPKG_COMMIT%
      git -C "${{ variables.vcpkgDir }}" checkout %VCPKG_COMMIT%
      echo.
      echo ------------------------------------------------------------------------------
      echo -- Bootstrap VCPKG
      echo ------------------------------------------------------------------------------
      ${{ variables.vcpkgDir }}/bootstrap-vcpkg
    displayName: 'Install VCPKG'
    env:
      GITHUB_TOKEN: $(GITHUB_TOKEN)

  - task: Cache@2
    displayName: Configure cache of VCPKG packages
    inputs:
      key: |
        vcpkg | v11 | $(vcpkgCommit) | ${{ parameters.name }} | $(Build.SourcesDirectory)/vcpkg.json
      restoreKeys: |
        vcpkg | v11 | $(vcpkgCommit) | ${{ parameters.name }}
      path: ${{ variables.buildDirectory }}/vcpkg_installed/
      cacheHitVar: VCPKG_CACHE_RESTORED

  - script: |
      echo ------------------------------------------------------------------------------
      echo -- Locating Visual Studio installation
      echo ------------------------------------------------------------------------------
      vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath > vs_path.txt
      set /p VSINSTALLDIR=<vs_path.txt
      if not "%VSINSTALLDIR:~-1%"=="\" set "VSINSTALLDIR=%VSINSTALLDIR%\"
      if not exist "%VSINSTALLDIR%" (
        echo Visual Studio installation not found!
        exit 1
      )
      echo Found Visual Studio at: %VSINSTALLDIR%
      echo.
      echo ------------------------------------------------------------------------------
      echo -- Setting up ${{ parameters.platform }} build environment...
      echo ------------------------------------------------------------------------------
      call "%VSINSTALLDIR%VC\Auxiliary\Build\vcvarsall.bat" ${{ parameters.platform }}
      if %ERRORLEVEL% neq 0 (
        echo "Failed to configure MSVC environment. Exiting..."
        exit 1
      )
      echo MSVC environment configured successfully.
      echo.
      echo ------------------------------------------------------------------------------
      echo -- CMake: generate [${{ parameters.buildConfiguration }}]
      echo ------------------------------------------------------------------------------
      cmake -GNinja -B ${{ variables.buildDirectory }} -DCMAKE_BUILD_TYPE=${{ parameters.buildConfiguration }} -DCMAKE_TOOLCHAIN_FILE=${{ variables.vcpkgDir }}/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ parameters.vcpkgTriplet }} ${{ parameters.cmakeGenArgs }}
      if %ERRORLEVEL% neq 0 (
        echo CMake configuration failed. Exiting...
        exit 1
      )
      echo.
      echo ------------------------------------------------------------------------------
      echo -- Build [${{ parameters.buildConfiguration }}]
      echo ------------------------------------------------------------------------------
      ninja -C ${{ variables.buildDirectory }}
      if %ERRORLEVEL% neq 0 (
        echo Build failed. Exiting...
        exit 1
      )
    displayName: 'Build [${{ parameters.platform }}]'

  - script: |
      ctest --test-dir ${{ variables.buildDirectory }} -T test --output-on-failure -j2
    displayName: 'Run tests'
    condition: and(succeeded(), eq('${{ parameters.enableRunTests }}', true))

  - ${{ if eq(parameters.publishTestResults, 'onFailure') }}:
    - script: |
        python "$(Build.SourcesDirectory)/CI/azure-devops/scripts/filter_failed_test_results.py" --build-dir "${{ variables.buildDirectory }}"
      displayName: 'Filter failed test results'
      condition: and(not(canceled()), eq('${{ parameters.enableRunTests }}', true), failed())

  - ${{ if eq(parameters.publishTestResults, 'always') }}:
    - task: PublishTestResults@2
      displayName: 'Publish Test results'
      condition: and(not(canceled()), eq('${{ parameters.enableRunTests }}', true))
      continueOnError: true
      inputs:
        testResultsFormat: 'cTest'
        testResultsFiles: '**/Testing/**/Test.xml'
        searchFolder: '$(Build.SourcesDirectory)/${{ variables.buildDirectory }}'
        testRunTitle: '${{ parameters.name }} [${{ parameters.buildConfiguration }}]'
        buildPlatform: '${{ parameters.platform }}'
        buildConfiguration: '${{ parameters.buildConfiguration }}'
        failTaskOnMissingResultsFile: false

  - ${{ if eq(parameters.publishTestResults, 'onFailure') }}:
    - task: PublishTestResults@2
      displayName: 'Publish failed Test results'
      condition: and(not(canceled()), eq('${{ parameters.enableRunTests }}', true), failed())
      continueOnError: true
      inputs:
        testResultsFormat: 'cTest'
        testResultsFiles: '**/Testing/failed/Test.xml'
        searchFolder: '$(Build.SourcesDirectory)/${{ variables.buildDirectory }}'
        testRunTitle: '${{ parameters.name }} [${{ parameters.buildConfiguration }}] (failed only)'
        buildPlatform: '${{ parameters.platform }}'
        buildConfiguration: '${{ parameters.buildConfiguration }}'
        failTaskOnMissingResultsFile: false
